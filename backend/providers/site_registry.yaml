# 站点注册表（URL 分诊器数据源）
# pattern 为相对路径正则（re.search）；robots_verdict 为最近实测结论，运行时以实时 robots 为准。
domains:
  zhipin.com:
    robots_verdict: "2026-10-29 实测：通用 UA 允许无参数详情页与 /zhaopin/ 编码列表页；禁带 query 的列表页与 /sem/"
    min_interval: 2.0
    pages:
      - { pattern: "^/job_detail/[A-Za-z0-9_~]+\\.html$", type: job_page, parser: zhipin_job, fetcher: httpx }
      - { pattern: "^/zhaopin/", type: job_list, parser: zhipin_list, fetcher: playwright }  # JS 渲染页：默认不抓，需手动启用 Playwright 通道
  zhaopin.com:
    robots_verdict: "2026-10-29 实测：禁一切带 ? 的 URL 与 /user/、/api/；裸职位页允许"
    min_interval: 3.0
    pages:
      - { pattern: "^/jobs?/[A-Za-z0-9_]+/?$", type: job_page, parser: zhaopin_job, fetcher: httpx }
  zhihu.com:
    robots_verdict: "对 Googlebot 开放内容页、禁 /search；通用规则运行时解析"
    min_interval: 3.5
    pages:
      - { pattern: "^/question/\\d+", type: review_page, parser: zhihu_question, fetcher: httpx }
  tieba.baidu.com:
    robots_verdict: "按 UA 分规则，通用规则运行时解析"
    min_interval: 3.0
    pages:
      - { pattern: "^/p/\\d+$", type: review_page, parser: tieba_thread, fetcher: httpx }
  xiaohongshu.com:
    robots_verdict: "限制严格：仅发现层摘要，不抓详情"
    min_interval: 5.0
    pages: []
  # ── T1 免风控直取层（2026-10-30 POC 实测结论）──
  gooood.cn:
    robots_verdict: "POC 实测：完全开放直取，/category/jobs/ 列表 107KB 实内容、214 招聘链接"
    min_interval: 3.0
    pages:
      - { pattern: "^/(category/)?jobs/?$", type: job_list, parser: generic, fetcher: httpx }
      - { pattern: "^/category/interview-jobs", type: job_list, parser: generic, fetcher: httpx }
      - { pattern: "^/job/", type: job_page, parser: generic, fetcher: httpx }
  iguopin.com:
    robots_verdict: "POC 实测：SPA 壳页（1KB），需 Playwright 或走 T2 索引"
    min_interval: 4.0
    pages:
      - { pattern: "^/job", type: job_list, parser: generic, fetcher: playwright }
  job.mohrss.gov.cn:
    robots_verdict: "POC 实测：https TLS 不兼容需 http 回退；http 200 正常"
    min_interval: 5.0
    pages:
      - { pattern: ".", type: gov_page, parser: gov_notice, fetcher: httpx }
